<!--
  The sign-in email. Floor signs people in with a code they type into the app, never a link.

  Used for two Supabase templates: "Magic link" (someone who already has an account) and
  "Confirm sign up" (someone signing in for the first time). Both must show {{ .Token }}.
  Subject for both: {{ .Token }} is your Floor code
-->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 440px; margin: 0 auto; padding: 24px; color: #15131F;">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Your Floor code</h2>
  <p style="margin: 0 0 16px; font-size: 15px; line-height: 22px;">Type this code into the app to sign in.</p>
  <p style="margin: 0 0 16px; font-size: 32px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
  <p style="margin: 0; font-size: 13px; line-height: 18px; color: #5E5B73;">
    It works once and runs out soon. Nobody from Floor will ever ask you for it. If you didn't ask
    for a code, you can ignore this email.
  </p>
</div>
